<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <style>.m{animation:m 4s ease-in-out infinite alternate}@keyframes m{from{transform:translateX(-500px)}to{transform:translateX(500px)}}</style>
  </defs>
  <rect y="5.5" width="1200" height="1" fill="#1f2933"/>
  <rect class="m" x="350" y="5" width="500" height="2" fill="url(#g)"/>
</svg>
